# Main benchmark: choose max_steps/budget after measuring B5 on MoLab.
run:
  kind: benchmark
  budget_note: null
paths:
  data_root: data
  cache_dir: cache/huggingface
  run_dir: runs/b0
seed: 42
model:
  variant: b5
  feature_dim: 256
  pretrained: true
  pretrained_lock: configs/mit_b5_imagenet.lock.json
  local_files_only: false
data:
  source_train: manifests/source_train.jsonl
  source_dev: manifests/source_dev.jsonl
  target_val: manifests/target_val.jsonl
  gta_label_encoding: raw_ids
  city_label_encoding: raw_ids
  mapping_verified: false
  unknown_policy: error
  crop_hw: [512, 512]
  scale_range: [0.5, 1.5]
  eval_hw: [512, 1024]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
train:
  device: auto
  precision: auto
  batch_size: 2
  workers: 0
  grad_accumulation: 1
  backbone_lr: 0.00006
  head_lr: 0.0006
  weight_decay: 0.01
  max_steps: null
  warmup_steps: 100
  poly_power: 0.9
  min_lr: 0.0
  clip_grad_norm: 1.0
  log_every: 20
  eval_every: 0
  eval_every_epoch: true
  checkpoint_every: 1000
  max_skipped_updates: 100
  save_best_target_val: false
